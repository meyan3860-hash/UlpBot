name: Run Combot Bot

on:
  workflow_dispatch:

jobs:
  run-bot:
    runs-on: windows-latest
    timeout-minutes: 360 # 6 hours

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Prepare D: drive and copy files
      run: |
        New-Item -Path D:\bot -ItemType Directory -Force
        Copy-Item -Path .\combobot.exe -Destination D:\bot\combobot.exe
        Copy-Item -Path .\run.ps1 -Destination D:\bot\run.ps1
        Set-Location D:\bot

    - name: Run the bot
      run: powershell -File D:\bot\run.ps1
