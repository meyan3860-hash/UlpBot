name: Run Combot Bot

on:
  workflow_dispatch:

jobs:
  run-bot:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare D drive and copy files
        shell: pwsh
        run: |
          New-Item -Path "D:\bot" -ItemType Directory -Force

          Copy-Item -Path ".\combobot.exe" -Destination "D:\bot\combobot.exe" -Force
          Copy-Item -Path ".\run.ps1" -Destination "D:\bot\run.ps1" -Force

          Write-Host "Files copied to D:\bot"

      - name: Run the bot
        shell: pwsh
        run: |
          Set-Location "D:\bot"
          powershell -ExecutionPolicy Bypass -File ".\run.ps1"
